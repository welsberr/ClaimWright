schema_version: claimwright.collaboration_policy.v1
policy_id: claimwright.collaboration.institutional.v1
version: 0.1
rules:
  - id: destination_scope_required
    decision_points: [propose, review, promote]
    actions: [propose_group_contribution, review_group_contribution, accept_group_contribution]
    default_decision: hard_gate
    obligations: [record_destination_scope, record_release_level, preserve_provenance]
  - id: contribution_review_separation
    decision_points: [promote, adjudicate]
    actions: [accept_group_contribution]
    default_decision: require_review
    required_reviewers: [group-reviewer]
    obligations: [separate_contributor_from_approver, record_review_receipt]
  - id: negative_result_preservation
    decision_points: [propose, promote]
    actions: [propose_group_contribution, accept_group_contribution]
    default_decision: soft_gate
    obligations: [preserve_failed_or_inconclusive_outcome]
  - id: stewardship_required
    decision_points: [promote, act]
    actions: [accept_group_contribution, transfer_knowledge_custody]
    default_decision: hard_gate
    required_reviewers: [scope-steward, records-custodian]
    obligations: [assign_group_steward, record_custody_authority]
  - id: rationale_preservation
    decision_points: [propose, review, promote, supersede]
    actions: [propose_group_contribution, review_group_contribution, accept_group_contribution, withdraw_knowledge_release]
    default_decision: require_review
    obligations: [preserve_decision_rationale, preserve_rejected_alternatives]
  - id: prior_work_review
    decision_points: [query, propose]
    actions: [prior_work_review, initiate_durable_work]
    default_decision: require_review
    obligations: [record_prior_work_query, preserve_negative_results, review_similarity_candidates]
  - id: catalog_least_disclosure
    decision_points: [federate_export, federate_import, read]
    actions: [publish_federation_catalog, import_federation_catalog, read_federation_catalog_entry]
    default_decision: require_review
    obligations: [apply_receiver_release_cap, prevent_protected_topic_inference, preserve_catalog_signature]
    required_reviewers: [scope-steward]
  - id: subscription_purpose_and_routing
    decision_points: [act, federate_export, federate_import]
    actions: [manage_federation_subscription, export_incremental_changes, import_incremental_changes]
    default_decision: require_review
    required_reviewers: [scope-steward]
    obligations: [record_subscription_purpose, bound_change_scope, prevent_silent_auto_promotion, verify_before_acknowledgement]
  - id: multi_party_review_feedback
    decision_points: [review, promote, propose, adjudicate]
    actions: [review_group_contribution, accept_group_contribution, record_federation_feedback]
    default_decision: require_review
    required_reviewers: [scope-steward, group-reviewer]
    obligations: [evaluate_quorum_by_risk, require_independent_high_risk_review, preserve_dissent_and_minority_position, disclose_conflict_of_interest, preserve_appeal_path]
