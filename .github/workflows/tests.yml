name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path tools/claimwright/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/claimwright/Cargo.toml
      - run: bash -n examples/publication-gate-ci.sh
